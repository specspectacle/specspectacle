[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum coverage threshold (relaxed for Phase 1 - foundation only)
# Will increase to 70% once all modules are implemented (Week 8)
addopts = 
    --verbose
    --cov=specspectacle
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=70

# Test paths
testpaths = tests

# Ignore deprecation warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning

# Coverage configuration
[coverage:run]
source = specspectacle
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
