[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "specspectacle"
dynamic = [
    "version",
    "description",
    "readme",
    "license",
    "authors",
    "classifiers",
    "keywords",
    "urls",
    "dependencies",
    "optional-dependencies",
    "scripts",
    "requires-python",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | venv313
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["venv/*", "venv313/*", ".venv/*", "build/*", "dist/*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start with false, enable gradually
ignore_missing_imports = true
files = ["specspectacle"]
exclude = ["venv", "venv313", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=specspectacle",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=70",
]
markers = [
    "e2e: end-to-end tests",
    "integration: integration tests",
    "unit: unit tests",
]

[tool.coverage.run]
branch = true
source = ["specspectacle"]
omit = [
    "tests/*",
    "venv/*",
    "venv313/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.pylint.messages_control]
max-line-length = 100
disable = [
    "C0103",  # Invalid name (we use descriptive names)
    "C0114",  # Missing module docstring (we'll add these)
    "C0115",  # Missing class docstring (we'll add these)
    "C0116",  # Missing function docstring (we'll add these)
    "R0903",  # Too few public methods (data classes are OK)
    "R0913",  # Too many arguments (sometimes necessary)
    "W0212",  # Protected access (needed for testing)
]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "venv",
    "venv313",
    "build",
    "dist",
    ".eggs",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "venv",
    "venv313",
    "build",
    "dist",
    ".eggs",
    "references",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports, etc.)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modernise syntax)
    "B",   # flake8-bugbear (likely bugs & design issues)
    "SIM", # flake8-simplify (simplifiable code)
]
ignore = [
    "E501",   # line too long — black handles this
    "B008",   # do not perform function calls in default args (Pydantic uses this a lot)
    "SIM108", # ternary operator — can reduce readability
    "UP007",  # use X | Y for unions — keep Optional for clarity
    "B904",   # do not assert blind exception
    "B017",   # do not assert blind exception
    "SIM105", # Replace `try`-`except`-`pass` with `with contextlib.suppress(Exception
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # use of assert — fine in tests
    "SIM",   # simplification warnings can obscure test intent
]

[tool.ruff.lint.isort]
# Keep consistent with the standalone isort config above
known-first-party = ["specspectacle"]

