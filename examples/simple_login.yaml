name: "Simple Login Demo"
version: "0.1.0"
description: "Demonstrates a standard login flow with narration and overlays"

config:
  target_app: "https://www.saucedemo.com"
  viewport: {width: 1280, height: 720}
  timeout: 5000
  headless: false

output:
  filename: "login_demo.mp4"
  fps: 30
  resolution: "1280x720"

narration:
  enabled: true
  voice: "en-US-Neural2-F"

flows:
  - name: "Login Process"
    steps:
      - action: navigate
        url: "https://www.saucedemo.com"
        overlay:
          text: "Navigating to login page..."
          position: "top"
        narration:
          text: "Welcome to the Sauce Demo application. We will log in using the standard user credentials."
      
      - action: wait_for_selector
        selector: "#user-name"
        overlay:
          text: "Login Page Loaded"
          position: "top"

      - action: type
        selector: "#user-name"
        text: "standard_user"
        delay: 100
        narration:
          text: "First, we enter the username."

      - action: type
        selector: "#password"
        text: "secret_sauce"
        delay: 100
        narration:
          text: "Then, the password."
      
      - action: click
        selector: "#login-button"
        narration:
          text: "Click login to proceed."
        overlay:
          text: "Authenticating..."
          position: "center"
          style: {background_color: "#28a745EE"}

      - action: wait_for_selector
        selector: ".inventory_list"
        narration:
          text: "And we are successfully logged in to the inventory dashboard."
        overlay:
          text: "Success!"
          position: "bottom"
          duration: 3.0
